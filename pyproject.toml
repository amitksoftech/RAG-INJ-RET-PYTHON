[project]
name = "rag-service"
version = "0.1.0"
description = "Docker-first, asynchronous retrieval-augmented generation service"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "dramatiq[redis]>=1.17,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-json-logger>=3,<5",
  "python-multipart>=0.0.18,<1",
  "qdrant-client>=1.12,<2",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rag_service"]
warn_unused_ignores = true
exclude = ["alembic"]
