apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
  namespace: rag-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-worker
    spec:
      serviceAccountName: rag-service
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: rag-service:latest
          command: ["dramatiq", "rag_service.workers.tasks", "--processes", "1", "--threads", "4"]
          envFrom:
            - configMapRef:
                name: rag-service-config
            - secretRef:
                name: rag-service-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      terminationGracePeriodSeconds: 90
