apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
    spec:
      serviceAccountName: rag-service
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: rag-service:latest
          command: ["uvicorn", "rag_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-service-config
            - secretRef:
                name: rag-service-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rag-api
  ports:
    - name: http
      port: 80
      targetPort: http
