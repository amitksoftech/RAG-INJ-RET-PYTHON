# Requires External Secrets Operator and a ClusterSecretStore named aws-secrets-manager.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rag-service-secrets
  namespace: rag-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: rag-service-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rag-service/production
