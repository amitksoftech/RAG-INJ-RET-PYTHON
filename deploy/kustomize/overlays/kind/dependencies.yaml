apiVersion: v1
kind: Secret
metadata:
  name: rag-service-secrets
  namespace: rag-system
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: rag-sources
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_REGION: us-east-1
  OPENROUTER_API_KEY: ""
  OPENROUTER_CHAT_MODEL: ""
  OPENROUTER_EMBEDDING_MODEL: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: rag-system
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: rag}
            - {name: POSTGRES_USER, value: rag}
            - {name: POSTGRES_PASSWORD, value: rag}
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rag-system
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rag-system
spec:
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rag-system
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: rag-system
spec:
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data"]
          env:
            - {name: MINIO_ROOT_USER, value: minioadmin}
            - {name: MINIO_ROOT_PASSWORD, value: minioadmin}
          ports: [{containerPort: 9000}]
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: rag-system
spec:
  selector: {app: minio}
  ports: [{port: 9000, targetPort: 9000}]
