# Requires External Secrets Operator and a ClusterSecretStore named azure-key-vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rag-service-secrets
  namespace: rag-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: rag-service-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rag-service-production
